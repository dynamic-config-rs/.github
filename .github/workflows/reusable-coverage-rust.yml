# Line coverage with cargo-llvm-cov, callable. Non-gating by default:
# the threshold ratchets per repo, and a coverage drop is a review
# conversation before it is a red X.
name: Reusable Rust coverage

on:
  workflow_call:
    inputs:
      features:
        description: Cargo features for the covered run
        required: false
        type: string
        default: ""
      minimum:
        description: Fail below this line-coverage percentage (0 = report only)
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-llvm-cov
      - env:
          FEATURES: ${{ inputs.features }}
          MINIMUM: ${{ inputs.minimum }}
        run: |
          flags=""
          [ -n "$FEATURES" ] && flags="--features $FEATURES"
          # shellcheck disable=SC2086
          cargo llvm-cov --workspace $flags --summary-only --json > coverage.json

          percent=$(python3 -c "
          import json
          data = json.load(open('coverage.json'))
          print(round(data['data'][0]['totals']['lines']['percent'], 1))
          ")

          echo "line coverage: ${percent}%" | tee -a "$GITHUB_STEP_SUMMARY"

          awk -v p="$percent" -v m="$MINIMUM" 'BEGIN { exit !(p >= m) }' || {
            echo "::error::coverage ${percent}% is below the ${MINIMUM}% floor"
            exit 1
          }
